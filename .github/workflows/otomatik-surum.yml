# ===========================================================================
# OTOMATIK SURUM — main'e giren her degisiklik bir surum uretir (2026-09-21).
#
# NEDEN: onceden surum YALNIZ elle `v*` etiketi itilince cikiyordu. Bir PR
# main'e girdikten sonra "yayinlanmis" bir ikili YOKTU; kullanici derleyiciyi
# kaynaktan derlemek ya da eski surumu kullanmak zorundaydi.
#
# BU YUVARLANAN ETIKET DEGIL. Depo 3.13.0'dan once `v2.1.0.<kosum>` bicimli
# yuzlerce etiket biriktirdi ve bu BILEREK kaldirildi ("stable-only
# versioning", build.yml create-release). Buradaki model farkli: her merge
# ANLAMLI bir SemVer artisi alir (varsayilan YAMA), yani v3.13.1 -> v3.13.2 ->
# v3.13.3. Kosum numarasi surum adina GIRMEZ.
#
# ARTIS SEVIYESI: varsayilan `patch`. Birlesen PR'IN ACIKLAMASINDA ya da
# commit mesajinda bir satir olarak `Surum: minor` ya da `Surum: major` (veya
# `Release: ...`) gecerse o seviye kullanilir. CHANGELOG'daki SemVer
# politikasi boyle uygulanir: ozellik -> minor, kirici degisiklik -> major.
# PR ACIKLAMASI AYRICA OKUNUR: depo ayari squash commit govdesine PR
# aciklamasini DEGIL commit mesajlarini koyuyor (squash_merge_commit_message =
# COMMIT_MESSAGES); yalniz commit govdesine bakan eski hal PR'da yazilan
# `Surum: minor`u hic gormuyordu. Ayni hata tulpar-engine'de iki ozellik
# surumunu sessizce yama yapti (motor Tuzaklar 8cn, 2026-09-25).
#
# SURUMU BU IS YAYINLAMAZ, yalnizca ETIKETI iter. Etiketi build.yml gorur
# (`tags: ['v*']`) ve DERLEYIP TESTLERI KOSTUKTAN sonra Release'i olusturur.
# Yani "yesil olmayan bir ikili yayinlanmaz" kurali degismedi; burasi yalnizca
# "etiketi elle atmayi" ortadan kaldirir.
#
# NEDEN AUTOMERGE_PAT: GITHUB_TOKEN ile itilen bir etiket asagi akis
# is akislarini TETIKLEMEZ (GitHub'in ozyineleme korumasi; ayni tuzak
# auto-merge.yml'de belgeli). O durumda etiket olusur ama Release HIC
# cikmazdi. Depoya sinirli, Contents yazma yetkili ince taneli PAT bu
# korumaya takilmaz.
#
# ATLANAN DURUMLAR (hepsi is ozetine yazilir, sessiz degil):
#   * yalniz belge degismis (README / benchmarks ciktilari) -> ikili ayni,
#     yeni surum anlamsiz;
#   * HEAD'de zaten bir `v*` etiketi var -> is yeniden kosturulmus, ikinci
#     kez etiketleme;
#   * hesaplanan etiket zaten var -> KIRMIZI (sessizce uzerine yazmak yerine).
#
# BILINEN SINIR: `CMakeLists.txt`'teki `project(... VERSION x.y.z)` bu is
# tarafindan YUKSELTILMEZ (CI'dan main'e commit itmek, her surumde bir tam
# derleme daha tetikler). O deger yalnizca YEREL gelistirme derlemelerinin
# `<surum>-dev` etiketini besler; yayinlanan ikili her zaman etiketi tasir
# (build.yml `-DTULPAR_VERSION`). Bir MINOR/MAJOR kesildiginde CMakeLists'i
# elle yukseltmek hala dogru is (bkz. RELEASING.md).
# ===========================================================================
name: Otomatik surum

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read   # birlesen PR'in aciklamasi (artis seviyesi, asagida)

# Art arda iki merge: etiketler SIRAYLA hesaplanmali. Iptal etmiyoruz —
# iptal edilen bir kosum, surumu hic cikmamis bir merge birakir.
concurrency:
  group: otomatik-surum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  etiket:
    # Is duzeyi sinir: adim sinirlarinin YAKALAYAMADIGI asilmalar icin
    # (adimsiz bekleme, Post adimlari). Olculen en uzun basarili is
    # suresinin birkac kati.
    timeout-minutes: 10
    name: Sonraki surumu hesapla ve etiketle
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — etiket gecmisi lazim (en son `v*` bulunacak).
      #
      # `token:` SART, ve bu OLCULDU (2026-09-21, motor v0.1.5): checkout
      # kimligi git yapilandirmasina bir HTTP BASLIGI olarak yaziyor
      # (`http.<url>.extraheader: AUTHORIZATION: basic ...`). O baslik, remote
      # URL'sine gomulen kullanici/parolayi EZIYOR — yani asagida remote'u
      # PAT'li bir URL'ye cevirmek HICBIR SEY degistirmiyor, push yine
      # GITHUB_TOKEN ile gidiyor. Sonuc: etiket olusuyor, ama GitHub'in
      # ozyineleme korumasi yuzunden release is akisi HIC tetiklenmiyor —
      # "surum cikti sandim, cikmamis" hatasinin tam olarak bu bicimi
      # yasandi. Kimligi BURADA PAT yapmak tek dogru yer.
      - uses: actions/checkout@v6
        timeout-minutes: 5
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_PAT }}

      - name: Karar + etiket
        timeout-minutes: 5
        env:
          # PAT yoksa is ACIKCA kirmizi olur: "surum cikmadi" sessiz kalmasin.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          # PR aciklamasini OKUMAK icin is akisinin kendi belirteci (yukaridaki
          # `pull-requests: read`). PAT'e bu yetkiyi eklemek gerekmesin diye
          # ayri: PAT yalniz Contents yazma icin var.
          GH_OKU: ${{ github.token }}
        run: |
          set -euo pipefail

          ozet() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AUTOMERGE_PAT gizli anahtari yok — etiket itilemez (GITHUB_TOKEN ile itilen etiket release is akisini tetiklemez). Depo Settings > Secrets > Actions altina ekleyin."
            exit 1
          fi

          # --- 1) Zaten etiketli mi (is yeniden kosturuldu)? ----------------
          var="$(git tag --points-at HEAD | grep -E '^v[0-9]' || true)"
          if [ -n "$var" ]; then
            ozet "## Surum atlandi"
            ozet ""
            ozet "HEAD zaten etiketli: \`$(echo "$var" | tr '\n' ' ')\`"
            echo "HEAD zaten etiketli — ikinci kez etiketlenmiyor."
            exit 0
          fi

          # --- 2) Yalniz belge mi degisti? ---------------------------------
          # build.yml'deki detect-docs-only ile AYNI izin listesi: bu yollar
          # ikiliyi degistiremez, yani yeni bir surum anlamsiz olur.
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            degisen="$(git diff --name-only HEAD^..HEAD)"
            kod="$(echo "$degisen" | grep -vE '^(README\.md|benchmarks/RESULTS\.(md|json))$' || true)"
            if [ -n "$degisen" ] && [ -z "$kod" ]; then
              ozet "## Surum atlandi"
              ozet ""
              ozet "Yalniz belge/olcum ciktisi degismis — ikili ayni, yeni surum anlamsiz."
              echo "Yalniz belge degismis — surum cikarilmiyor."
              exit 0
            fi
          fi

          # --- 3) Artis seviyesi -------------------------------------------
          # `Surum: minor` / `Release: major` gibi bir satir birlesen PR'in
          # ACIKLAMASINDA ya da commit mesajinda varsa o; yoksa YAMA.
          # Commit mesaji TEK BASINA YETMEZ (motor Tuzaklar 8cn): bu depoda squash
          # govdesi PR aciklamasi degil commit mesajlaridir, PR'da yazilan
          # satir oraya hic gelmez. PR, commit'ten API ile bulunur
          # (commits/<sha>/pulls: main'e birlesmis olan).
          mesaj="$(git log -1 --format='%B')"
          pr_no=""
          pr_govde=""
          if pr_json="$(GH_TOKEN="$GH_OKU" gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                          --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty | {n: .number, b: (.body // "")}' 2>api_hata.log)"; then
            if [ -n "$pr_json" ]; then
              pr_no="$(jq -r '.n' <<< "$pr_json")"
              pr_govde="$(jq -r '.b' <<< "$pr_json")"
            fi
          else
            # Sessiz degil: seviye yalniz commit mesajindan okunur ve bu
            # hem uyari hem is ozeti olarak GORUNUR.
            echo "::warning::Birlesen PR API'den okunamadi — artis seviyesi yalniz commit mesajina gore: $(head -c 300 api_hata.log)"
            ozet "> UYARI: birlesen PR okunamadi, seviye yalniz commit mesajindan."
          fi
          # CRLF: web'de duzenlenen aciklamalar \r\n tasir; satir sonundaki \r
          # `[[:space:]]*$` ile yutulur.
          seviye_bul() {
            if grep -Eqi '^[[:space:]]*(surum|sürüm|release)[[:space:]]*:[[:space:]]*major[[:space:]]*$' <<< "$1"; then
              echo major
            elif grep -Eqi '^[[:space:]]*(surum|sürüm|release)[[:space:]]*:[[:space:]]*minor[[:space:]]*$' <<< "$1"; then
              echo minor
            else
              echo patch
            fi
          }
          seviye_pr="$(seviye_bul "$pr_govde")"
          seviye_commit="$(seviye_bul "$mesaj")"
          # Ikisinden BUYUGU: PR'da minor, commit'te major yazan biri major ister.
          seviye="patch"; seviye_kaynak="varsayilan"
          for aday in "$seviye_pr:PR #${pr_no:-?} aciklamasi" "$seviye_commit:commit mesaji"; do
            s="${aday%%:*}"; k="${aday#*:}"
            if [ "$s" = major ] || { [ "$s" = minor ] && [ "$seviye" = patch ]; }; then
              seviye="$s"; seviye_kaynak="$k"
            fi
          done
          echo "artis: $seviye ($seviye_kaynak; PR #${pr_no:-yok}: $seviye_pr, commit: $seviye_commit)"

          # --- 4) Son surumden sonrakini hesapla ---------------------------
          son="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$son" ]; then
            son="v0.0.0"
            echo "Hic `v*` etiketi yok — v0.0.0'dan basliyoruz."
          fi
          cekirdek="${son#v}"
          cekirdek="${cekirdek%%-*}"          # v1.2.3-rc1 -> 1.2.3
          IFS=. read -r X Y Z <<< "$cekirdek"
          X="${X:-0}"; Y="${Y:-0}"; Z="${Z:-0}"
          case "$seviye" in
            major) X=$((X+1)); Y=0; Z=0 ;;
            minor) Y=$((Y+1)); Z=0 ;;
            *)     Z=$((Z+1)) ;;
          esac
          yeni="v${X}.${Y}.${Z}"

          if git rev-parse -q --verify "refs/tags/$yeni" >/dev/null; then
            echo "::error::Hesaplanan etiket '$yeni' ZATEN VAR (son bulunan: $son). Etiket gecmisi beklenenden farkli — elle bakin; sessizce uzerine yazmiyoruz."
            exit 1
          fi

          # --- 5) Etiketle ve it -------------------------------------------
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          konu="$(git log -1 --format='%s')"
          git tag -a "$yeni" -m "$yeni — $konu"
          # Kimlik checkout'tan geliyor (yukaridaki `token:`); remote URL'sini
          # elle kurcalamak ISE YARAMIYOR — bkz. oradaki not.
          git push origin "$yeni"

          ozet "## Surum: \`$yeni\`"
          ozet ""
          ozet "| | |"
          ozet "|---|---|"
          ozet "| onceki | \`$son\` |"
          ozet "| artis | \`$seviye\` ($seviye_kaynak) |"
          ozet "| PR | ${pr_no:+#$pr_no} |"
          ozet "| commit | \`$konu\` |"
          ozet ""
          ozet "Etiket itildi; **Release'i build.yml olusturacak** (derleme + testler gectikten sonra)."
          echo "Etiket itildi: $yeni ($son -> $yeni, $seviye)"
