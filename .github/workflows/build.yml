name: Linux & macOS Build (LLVM)

on:
  push:
    branches: [ main, master, develop ]
    # Tag pushes (e.g. `git tag v1.0.0 && git push origin v1.0.0`) also
    # trigger this workflow so we can mint stable / explicitly-versioned
    # releases without hand-running anything else. The create-release
    # job below detects whether we're on a tag and uses the tag name
    # verbatim as the version (vs. the rolling `v2.1.0.<run>` we
    # auto-mint on main pushes).
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  # `actions: read` is needed by the reuse-PR-artifacts step on push:main
  # so it can list and download artifacts from the PR's earlier build run.
  actions: read

# Cancel superseded runs on the same ref so a fresh push to a PR
# branch immediately frees up the ~3-minute runner allocations of
# its previous build. `main` and tag refs are exempted via the
# `cancel-in-progress` expression so post-merge reuse-path builds
# always complete (the bench workflow consumes their artifacts —
# cancelling a half-finished main build would orphan that chain).
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Bench-bot's refresh PRs (and their squash-merges into main) touch
  # only README.md + benchmarks/RESULTS.{md,json}. A full build for
  # those is wasted wall-time — we'd burn one PR build *and* a
  # post-merge reuse build on a docs-only change that can't possibly
  # produce a different binary. This job computes the docs-only flag
  # once; the three OS build jobs (and create-release) inherit it via
  # `needs` and skip themselves when the flag is set. Skipped required
  # checks satisfy branch protection, so the bench PR still auto-merges
  # without manual intervention.
  detect-docs-only:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !wasm/emsdk
          sparse-checkout-cone-mode: false
      - name: Compute docs_only flag
        id: detect
        shell: bash
        run: |
          # Tag pushes always rebuild — they exist to mint a stable
          # release whose artifacts must be republished even if the
          # commit content is identical to a previous build.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag push — treating as code change."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "No parent commit available — defaulting to full build."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only HEAD^..HEAD)
          echo "Files changed since HEAD^:"
          printf '  %s\n' $changed
          # Allowlist of paths that can never affect built artifacts.
          # Everything bench-bot writes to lives here; if every changed
          # path is in this set, the build is a no-op.
          non_docs=$(echo "$changed" | grep -vE '^(README\.md|benchmarks/RESULTS\.(md|json))$' || true)
          if [ -n "$changed" ] && [ -z "$non_docs" ]; then
            echo "All changes are docs/bench-output — build can skip."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Code changed — full build required."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Windows'a NATIF destek 3.13.0'da bırakıldı — Windows kullanıcıları WSL
  # üzerinden Linux yolunu kullanıyor (bkz. CHANGELOG "Windows desteği: WSL").
  # Bu yüzden burada bir `build-windows` işi YOK; main'in branch protection
  # ayarından da `build-windows` zorunlu check'i KALDIRILMALI, yoksa PR'lar
  # hiç raporlanmayacak bir check'i bekler.
  build-linux:
    # Branch protection on this repo lists `build-linux` / `build-macos`
    # as *required* status checks, by name. A job-level
    # `if:` that evaluates to false makes the job "skipped" — which is
    # a separate conclusion from "success", and this repo's branch
    # protection refuses to consider skipped a satisfied requirement.
    # The bench-bot's docs-only PRs got wedged in that state for ~15 min
    # before someone noticed (PR #142). Run the job *unconditionally* and
    # gate every real step on the docs-only output instead, so the
    # check still reports green (all steps skipped = job successful)
    # for docs-only refreshes.
    needs: detect-docs-only
    runs-on: ubuntu-latest
    steps:
      # Docs-only short-circuit: the bench-bot's auto-refresh PRs only
      # touch README.md and benchmarks/RESULTS.{md,json}. The build is a
      # no-op for them. We still RUN the job (so the named required
      # status check appears as green to branch protection) but every
      # subsequent step gates on the docs-only flag below.
      - name: Docs-only skip notice
        if: needs.detect-docs-only.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; build steps will be skipped (job reports success)."

      # Skip the vendored Emscripten SDK at clone time — it's ~400 MB
      # and the main CMake build doesn't reference it (wasm builds run
      # locally via wasm/build_wasm.sh, never in CI). Saves ~20-40s of
      # checkout time on every job. cone-mode must be off because we
      # want to *exclude* a path while keeping everything else.
      - uses: actions/checkout@v6
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        with:
          sparse-checkout: |
            /*
            !wasm/emsdk
          sparse-checkout-cone-mode: false

      # On push:main we usually arrive at a squash-merge of a PR whose
      # build already ran green. Re-running the same build wastes 5-10
      # min of runner wall time and a few cents of compute. Try to
      # reuse the PR's published artifacts instead; if anything about
      # the lookup fails we fall through to a fresh build (no behavior
      # change in the worst case). pull_request and tag pushes always
      # build from source — they don't have a prior PR to reuse.
      - name: Try to reuse PR's build artifacts
        id: reuse
        if: needs.detect-docs-only.outputs.docs_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Default squash subject is "Title (#NN)" — extract NN. If
          # the commit isn't from a squash merge (e.g. direct push, or
          # merge-commit instead of squash), the subject lacks the ref
          # and we fall back to building.
          pr_num=$(git log -1 --format='%s' | grep -oE '\(#[0-9]+\)' | tr -d '(#)' || true)
          if [ -z "$pr_num" ]; then
            echo "No PR reference in commit subject — building from scratch."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha=$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          if [ -z "$head_sha" ]; then
            echo "PR #$pr_num not accessible — building from scratch."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Find a successful build on the PR's head commit. Limit 30
          # so a long-running PR with many force-pushes still finds
          # the right run. Returns the most recent if multiple.
          run_id=$(gh run list --workflow='Linux & macOS Build (LLVM)' \
                     --status=success --limit=30 \
                     --json databaseId,headSha \
                     --jq ".[] | select(.headSha==\"$head_sha\") | .databaseId" \
                     | head -1)
          if [ -z "$run_id" ]; then
            echo "No successful build run for PR #$pr_num head $head_sha — building from scratch."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Reusing artifacts from PR #$pr_num build run $run_id"
          # Stage the artifacts at the canonical paths the existing
          # Upload steps already point at, so reuse and built paths
          # produce structurally identical artifacts.
          #
          # Drop `set -e` around the restore so a transient download/cp
          # failure falls back to a fresh build instead of failing the
          # whole job. The job-level promise is "reuse if cheap, else
          # rebuild" — a flaky artifact API shouldn't take main red.
          set +e
          mkdir -p dist _pr-artifacts
          gh run download "$run_id" -n tulpar-linux-x64           -D _pr-artifacts
          dl_a=$?
          gh run download "$run_id" -n libtulpar_runtime-linux-x64 -D _pr-artifacts
          dl_b=$?
          # TameEngine paketi de yeniden kullanılıyor. Getirilmezse "Upload
          # TameEngine bundle" adımı boşa düşerdi: paketleme adımı reuse
          # yolunda ATLANIYOR, yani dosya yerelde hiç üretilmiyor.
          gh run download "$run_id" -n TameEngine-linux-x64        -D _pr-artifacts
          dl_c=$?
          if [ $dl_a -ne 0 ] || [ $dl_b -ne 0 ] || [ $dl_c -ne 0 ]; then
            echo "Artifact download failed (codes $dl_a,$dl_b,$dl_c) — falling back to fresh build."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp _pr-artifacts/tulpar-linux-x64           dist/tulpar-linux-x64 2>/dev/null || \
            cp _pr-artifacts/tulpar-linux-x64/tulpar-linux-x64 dist/tulpar-linux-x64
          cp _pr-artifacts/libtulpar_runtime-linux-x64.a dist/libtulpar_runtime-linux-x64.a 2>/dev/null || \
            cp _pr-artifacts/libtulpar_runtime-linux-x64/libtulpar_runtime-linux-x64.a dist/libtulpar_runtime-linux-x64.a
          cp _pr-artifacts/TameEngine-linux-x64.tar.gz dist/TameEngine-linux-x64.tar.gz 2>/dev/null || \
            cp _pr-artifacts/TameEngine-linux-x64/TameEngine-linux-x64.tar.gz dist/TameEngine-linux-x64.tar.gz
          if [ ! -f dist/tulpar-linux-x64 ] || [ ! -f dist/libtulpar_runtime-linux-x64.a ] \
             || [ ! -f dist/TameEngine-linux-x64.tar.gz ]; then
            echo "Artifact staging failed (file missing after copy) — falling back to fresh build."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          chmod +x dist/tulpar-linux-x64
          ls -la dist/
          echo "reused=true" >> "$GITHUB_OUTPUT"

      # ccache stores compiler outputs keyed on preprocessed source +
      # flags. First run on a fresh branch is a cold miss (no speedup);
      # subsequent runs hit on every untouched .cpp and only recompile
      # what actually changed. The action handles cache key / restore
      # / save and exposes `ccache gcc` / `ccache g++` via PATH wrappers.
      - name: Setup ccache
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache
          max-size: 500M

      # llvm-18-dev is ~120 MB of headers + static libs that apt downloads
      # then extracts on every fresh build. The cache-apt-pkgs action
      # snapshots /var/cache/apt + the .deb files keyed on the package
      # list, so warm restores skip both the download and the dpkg
      # configure step (~50-60s → ~5-8s). build-essential + cmake are
      # also in here but they're tiny — the win is dominated by LLVM.
      #
      # libx11-dev (+ the libx*-dev extras) provide the core X11 headers
      # (X11/Xlib.h, keysym.h, XKBlib.h, Xatom.h, Xresource.h, Xmd.h, …)
      # that raylib's GLFW X11 backend — compiled into tulpar_tame — needs
      # on Linux. The X11 *extension* headers (Xrandr/Xinerama/XInput2/
      # Xcursor/shape) are vendored in lib/raylib/x11_compat and shadow the
      # system copies via -I; only the core headers come from apt. This is
      # the same set a local dev box already has, so CI now reproduces the
      # working local build. The tame binary still dlopens X11/GL at
      # runtime, so this is a build-time-only header dep — it does not
      # reduce the output binary's portability.
      - name: Cache apt packages
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: build-essential cmake llvm-18-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
          version: 1.1

      - name: Verify apt packages installed
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          # The cache action installs the packages on cache miss + restore
          # symlinks them on cache hit. This step exists as a fast sanity
          # check that `llvm-config-18` (the smoke target) is reachable
          # — if the cache restore goes sideways we want a clear error
          # before CMake tries to find_package(LLVM).
          which llvm-config-18 cmake gcc g++
          llvm-config-18 --version
          # raylib/tame X11 build dep — fail loudly here, not 100 lines deep
          # in a raylib compile, if libx11-dev didn't land.
          test -f /usr/include/X11/Xlib.h || { echo "::error::libx11-dev missing (X11/Xlib.h) — tame build will fail"; exit 1; }

      - name: Build with LLVM
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          # Mirrors the formula used by `create-release` below so the
          # embedded version (`tulpar --version`) matches the published
          # release tag — which is what `tulpar update --check` compares
          # against.
          # Tag-pushed builds embed the tag name verbatim (so
          # `tulpar --version` shows e.g. `v2.2.0`). Branch builds
          # (main, PRs) omit the override and get CMake's default
          # "<project_version>-dev", which is fine for CI validation
          # — no release is minted for them.
          TULPAR_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          mkdir -p build
          cd build
          # CMAKE_<LANG>_COMPILER_LAUNCHER routes every cc/c++ invocation
          # through ccache without us having to fiddle with CC/CXX (and
          # without confusing autodetection that sniffs the compiler
          # binary's name).
          cmake_args="-DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          if [ -n "${TULPAR_VERSION}" ]; then
            cmake_args="${cmake_args} -DTULPAR_VERSION=${TULPAR_VERSION}"
          fi
          cmake .. ${cmake_args}
          cmake --build . --config Release -j$(nproc)
        timeout-minutes: 10

      # Test failures used to be masked with `continue-on-error: true`,
      # which hid a months-long Linux regression where every example
      # failed AOT linking against `libtulpar_runtime.a` (missing
      # OpenSSL link flags). Mask removed so test breakage actually
      # turns the job red and blocks the release.
      # All test+prep steps below are gated on `reused != 'true'` —
      # the PR's build already ran them and turned green, so a
      # successful reuse means we trust those results. (Tag pushes and
      # PRs always run them; only post-merge main-push uses the reuse
      # path.)
      - name: Run tests
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          cp build/tulpar tulpar
          chmod +x tulpar
          chmod +x build.sh
          ./build.sh test
        # History: the suite ran serially and grew to 87 examples (each a
        # full AOT compile + link), hitting ~5m45s — 87% of this job's wall
        # time — which is why the timeout kept getting raised (5 -> 15 min).
        # `build.sh test` now fans the examples out over `xargs -P$(nproc)`,
        # which brought it back down and 10 min looked like ~5x headroom.
        #
        # 2026-09-01 — 10 min was NOT headroom any more; measured, not guessed:
        #   * the example count grew 87 -> 129 (the `examples/en/` twins were
        #     never run before 2026-08-25; adding them ~doubled the set), and
        #   * the new `scene3d_*` / `tame3d_*` examples are far heavier per
        #     file — each one recompiles `lib/scene3d.tpr` (~16k lines) from
        #     scratch, since there is no precompiled-module cache.
        # Two consecutive runs of the SAME tree straddled the limit: 9m46s
        # (passed, 14s to spare) and >10m (timed out). A threshold that a
        # runner's speed variance can flip is a flake, not a guard.
        # Local reference: 100s on 16 cores @5GHz; a 4-core runner is ~7x
        # slower => ~12 min expected. 25 min is ~2x that — enough to absorb a
        # slow runner, still tight enough to catch a genuine hang.
        #
        # The real fix is a precompiled-module cache so 30 scene3d examples
        # stop rebuilding the same library 30 times; until then, budget honestly.
        timeout-minutes: 25

      # tests/*.test.tpr regression suites (gömülü `test` kitaplığı,
      # jest tarzı assert'ler). `./build.sh test` YALNIZ examples/ üzerinde
      # dolaşır ve orada tek ölçüt çıkış kodudur; bu paketler uzun süre
      # HİÇBİR otomasyonda koşmadı. 2026-08-04'te `assert`in bool koşullarda
      # hiçbir zaman başarısız olmadığı ortaya çıktı — hata tam olarak bu
      # körlükte yaşadı, çünkü paketler yeşil görünürken hiçbir şey
      # doğrulamıyorlardı. `suites` hedefi özet satırı üretmeyen paketi de
      # hata sayar, yani bir paket sessizce "koşmuyor" duruma düşemez.
      - name: Run tests/*.test.tpr suites
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: ./build.sh suites
        timeout-minutes: 15

      # typeinfer regression suite — drives `tulpar --strict <file>` over
      # tests/typeinfer/{pass,fail}/*.tpr. The runner already builds the
      # binary above; we just need to make the script executable.
      - name: Run typeinfer strict-mode tests
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          chmod +x tests/typeinfer/run.sh
          ./tests/typeinfer/run.sh
        timeout-minutes: 2

      # Builtin tablosu ↔ codegen ↔ LSP tutarlılık denetimi. Bir builtin üç
      # yerde birden bilinmek zorunda; bunlar elle senkron tutuluyordu ve
      # ayrışmışlardı. Ayrışmanın iki yönü de SESSİZ: tabloda olup codegen'de
      # olmayan çağrı typecheck'ten geçip çalışma anında patlıyor, codegen'de
      # olup tabloda olmayan çağrı ise HİÇ denetlenmiyor. Kaynak dosyalarını
      # okur, derleme gerektirmez (~0.1s).
      - name: Builtin table audit
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        run: python3 tests/builtin_audit.py --list
        timeout-minutes: 2

      # SHA-256 smoke test for the package-manager checksum helper.
      # Compiles the helper standalone against FIPS 180-4 reference
      # vectors. Cheap (~1s) and orthogonal to the main `tulpar` binary
      # so a regression in this isolated unit fails fast.
      - name: SHA-256 helper test
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          g++ -std=c++17 tests/sha256_smoke.cpp src/pkg/sha256.cpp \
              -Isrc/pkg -o sha256_smoke
          ./sha256_smoke

      - name: Prepare artifact
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p dist
          cp build/tulpar dist/tulpar-linux-x64
          cp build/libtulpar_runtime.a dist/libtulpar_runtime-linux-x64.a

      # UÇTAN UCA AOT DUMANI. "tulpar ikilisi oluştu" ile "tulpar çalışıyor"
      # ayrı iddialar ve macOS'ta ikincisi UZUN SÜRE hiç ölçülmedi: o iş yalnız
      # derleyip artefakt yüklüyordu. Sonuç, 2026-09-02'de ölçüldü — yayınlanan
      # `tulpar-macos-universal` ile HİÇBİR program derlenemiyordu
      # (`ld: library 'ssl' not found`) ve bu aylarca fark edilmedi; ancak
      # TameEngine paketleme adımı orada ilk kez bir `tulpar build` çağırınca
      # ortaya çıktı. Yani bulunması tesadüftü.
      #
      # Bu adım o boşluğu kapatıyor: derle → linkle → ÇALIŞTIR → çıktıyı
      # karşılaştır, artı doğrudan koşum yolu, stdlib (dosya + JSON) ve sürüm
      # satırı. Grafiksiz ve ~10 saniye, yani her platformda koşabilir.
      # Paketlemeden ÖNCE duruyor: bozuk bir derleyiciyi ucuz denetim söylesin.
      - name: AOT end-to-end smoke
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: bash tests/aot_smoke.sh dist/tulpar-linux-x64
        timeout-minutes: 5

      # TameEngine (3B sahne editörü) İNDİRİLEBİLİR bir paket olarak.
      # Editör bir Tulpar programı; derleyiciyi indiren biri onu kendisi
      # derlemek zorundaydı, yani pratikte yayınlanmış değildi.
      #
      # Çıplak ikili YETMİYOR: editörün doku/ses/model gezginleri yolları
      # ÇALIŞMA DİZİNİNE göre globluyor (`examples/assets/dokular/*.png`,
      # `.../sesler/*.wav`, `varliklar/*.glb`) ve şablonlar aynı yolları
      # kullanıyor — tek başına indirilen ikilide o listeler BOŞ çıkar ve
      # şablonlar dokusuz kurulur. Betik o düzeni koruyarak paketliyor ve
      # paketin KENDİSİNİ denetliyor (listeler dolu mu, derleme artığı
      # sızmış mı, ikili gerçekten açılıyor mu).
      #
      # Her koşumda çalışıyor, yalnız etiketlerde değil: yayın yolunun tek
      # kez ve en kötü anda sınanması bu depoda defalarca pahalıya patladı.
      - name: Package TameEngine
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          cp build/tulpar tulpar && chmod +x tulpar
          bash tools/package_tameengine.sh linux-x64 dist
        timeout-minutes: 15

      - name: Upload TameEngine bundle
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TameEngine-linux-x64
          path: dist/TameEngine-linux-x64.tar.gz

      # Upload runs unconditionally — `dist/tulpar-linux-x64` was
      # placed there either by the reuse step (downloaded from PR run)
      # or by Prepare artifact (copied from build/).
      - name: Upload artifact
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tulpar-linux-x64
          path: dist/tulpar-linux-x64

      - name: Upload runtime library
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: libtulpar_runtime-linux-x64
          path: dist/libtulpar_runtime-linux-x64.a

  build-macos:
    # See `build-linux` for why this is unconditional + gated per-step
    # instead of skipped at the job level.
    needs: detect-docs-only
    runs-on: macos-latest
    steps:
      - name: Docs-only skip notice
        if: needs.detect-docs-only.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; build steps will be skipped (job reports success)."

      - uses: actions/checkout@v6
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        with:
          sparse-checkout: |
            /*
            !wasm/emsdk
          sparse-checkout-cone-mode: false

      # Same reuse-on-push:main pattern as build-linux. See the Linux
      # job's reuse step for the rationale and fallback behavior.
      - name: Try to reuse PR's build artifacts
        id: reuse
        if: needs.detect-docs-only.outputs.docs_only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          pr_num=$(git log -1 --format='%s' | grep -oE '\(#[0-9]+\)' | tr -d '(#)' || true)
          if [ -z "$pr_num" ]; then
            echo "No PR reference in commit subject — building from scratch."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head_sha=$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
          if [ -z "$head_sha" ]; then
            echo "PR #$pr_num not accessible — building from scratch."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          run_id=$(gh run list --workflow='Linux & macOS Build (LLVM)' \
                     --status=success --limit=30 \
                     --json databaseId,headSha \
                     --jq ".[] | select(.headSha==\"$head_sha\") | .databaseId" \
                     | head -1)
          if [ -z "$run_id" ]; then
            echo "No successful build run for PR #$pr_num head $head_sha — building from scratch."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Reusing artifacts from PR #$pr_num build run $run_id"
          # See build-linux for the rationale on dropping `set -e` here.
          set +e
          mkdir -p dist _pr-artifacts
          gh run download "$run_id" -n tulpar-macos-universal           -D _pr-artifacts
          dl_a=$?
          gh run download "$run_id" -n libtulpar_runtime-macos-universal -D _pr-artifacts
          dl_b=$?
          # TameEngine paketi — build-linux'taki aynı gerekçe.
          gh run download "$run_id" -n TameEngine-macos-universal        -D _pr-artifacts
          dl_c=$?
          if [ $dl_a -ne 0 ] || [ $dl_b -ne 0 ] || [ $dl_c -ne 0 ]; then
            echo "Artifact download failed (codes $dl_a,$dl_b,$dl_c) — falling back to fresh build."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cp _pr-artifacts/tulpar-macos-universal           dist/tulpar-macos-universal 2>/dev/null || \
            cp _pr-artifacts/tulpar-macos-universal/tulpar-macos-universal dist/tulpar-macos-universal
          cp _pr-artifacts/libtulpar_runtime-macos-universal.a dist/libtulpar_runtime-macos-universal.a 2>/dev/null || \
            cp _pr-artifacts/libtulpar_runtime-macos-universal/libtulpar_runtime-macos-universal.a dist/libtulpar_runtime-macos-universal.a
          cp _pr-artifacts/TameEngine-macos-universal.tar.gz dist/TameEngine-macos-universal.tar.gz 2>/dev/null || \
            cp _pr-artifacts/TameEngine-macos-universal/TameEngine-macos-universal.tar.gz dist/TameEngine-macos-universal.tar.gz
          if [ ! -f dist/tulpar-macos-universal ] || [ ! -f dist/libtulpar_runtime-macos-universal.a ] \
             || [ ! -f dist/TameEngine-macos-universal.tar.gz ]; then
            echo "Artifact staging failed (file missing after copy) — falling back to fresh build."
            echo "reused=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          chmod +x dist/tulpar-macos-universal
          ls -la dist/
          echo "reused=true" >> "$GITHUB_OUTPUT"

      - name: Setup ccache
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache
          max-size: 500M

      # Brew installs llvm@18 from source on a cold runner — ~5-7 minutes
      # of wall time. The Cellar (the actual installed binaries +
      # headers) lives at `$(brew --prefix)/Cellar/llvm@18` and can be
      # tar+restored across runs. We pin to the runner-image OS so a
      # macos-13/14/15 swap doesn't restore an incompatible binary.
      #
      # Cache miss: `brew install` runs as before.
      # Cache hit:  symlink the cellar back into place + `brew link
      #             --force --overwrite llvm@18` to rewire opt/. The
      #             link step is ~3s vs the 5-min install.
      #
      # cmake is already in the GitHub Actions macos-* runner image,
      # so we only cache the LLVM tree.
      - name: Cache brew LLVM
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        id: brew-llvm-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/llvm@18
            /usr/local/Cellar/llvm@18
          key: ${{ runner.os }}-${{ runner.arch }}-brew-llvm18-v1

      - name: Install dependencies
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          brew list --versions cmake >/dev/null 2>&1 || brew install cmake
          if [ "${{ steps.brew-llvm-cache.outputs.cache-hit }}" = "true" ]; then
            # Cellar restored from cache; just rewire the symlinks into
            # $(brew --prefix)/opt/llvm@18 that find_package(LLVM) looks at.
            brew link --force --overwrite llvm@18 || brew install llvm@18
          else
            brew list --versions llvm@18 >/dev/null 2>&1 || brew install llvm@18
          fi

      - name: Build with LLVM
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          # Tag-pushed builds embed the tag name verbatim; branch
          # builds omit the override and use CMake's default dev
          # version.
          TULPAR_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          # Use `brew --prefix` instead of hardcoding /opt/homebrew so
          # this still works if GitHub's macos-latest image switches
          # between ARM (/opt/homebrew) and Intel (/usr/local) or a
          # self-hosted runner uses a different layout.
          LLVM_PREFIX="$(brew --prefix llvm@18)"
          export PATH="$LLVM_PREFIX/bin:$PATH"
          export LLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"
          mkdir -p build
          cd build
          cmake_args="-DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=$LLVM_DIR
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          if [ -n "${TULPAR_VERSION}" ]; then
            cmake_args="${cmake_args} -DTULPAR_VERSION=${TULPAR_VERSION}"
          fi
          cmake .. ${cmake_args}
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)
        timeout-minutes: 10

      - name: Prepare artifact
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p dist
          cp build/tulpar dist/tulpar-macos-universal
          cp build/libtulpar_runtime.a dist/libtulpar_runtime-macos-universal.a

      # UÇTAN UCA AOT DUMANI. "tulpar ikilisi oluştu" ile "tulpar çalışıyor"
      # ayrı iddialar ve macOS'ta ikincisi UZUN SÜRE hiç ölçülmedi: o iş yalnız
      # derleyip artefakt yüklüyordu. Sonuç, 2026-09-02'de ölçüldü — yayınlanan
      # `tulpar-macos-universal` ile HİÇBİR program derlenemiyordu
      # (`ld: library 'ssl' not found`) ve bu aylarca fark edilmedi; ancak
      # TameEngine paketleme adımı orada ilk kez bir `tulpar build` çağırınca
      # ortaya çıktı. Yani bulunması tesadüftü.
      #
      # Bu adım o boşluğu kapatıyor: derle → linkle → ÇALIŞTIR → çıktıyı
      # karşılaştır, artı doğrudan koşum yolu, stdlib (dosya + JSON) ve sürüm
      # satırı. Grafiksiz ve ~10 saniye, yani her platformda koşabilir.
      # Paketlemeden ÖNCE duruyor: bozuk bir derleyiciyi ucuz denetim söylesin.
      - name: AOT end-to-end smoke
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: bash tests/aot_smoke.sh dist/tulpar-macos-universal
        timeout-minutes: 5

      # DİL ANLAMBİLİMİ — ARM64'ün TEK gerçek doğrulaması.
      #
      # `macos-latest` Apple Silicon, yani **arm64**; Linux işi x86-64.
      # `CMakeLists.txt` mimariye göre AYRI LLVM backend'i linkliyor ve
      # `vmvalue_abi_uses_sret()` ABI'yi çalışma zamanında seçiyor — yani
      # AArch64 kod üretimi ayrı bir yol. O yolu bugüne kadar YALNIZ
      # yukarıdaki 4 vakalık AOT dumanı doğruluyordu.
      #
      # Duman "derleyici çalışıyor mu"yu ölçer, "dil doğru mu"yu değil.
      # 69 paket saf Tulpar anlambilimi (aritmetik, dizi/şekil önbelleği,
      # struct, closure, string, JSON, ORM/router mantığı) ve grafiksiz.
      # ARM64'e özgü bir codegen/ABI sapması bugün hiçbir yere düşmüyordu.
      #
      # Not: `build.sh suites` ile `tests/pkg_audit.sh` uzun süre çıplak
      # `timeout` çağırıyordu — macOS'ta o komut YOK. Bu adım eklenirken
      # ikisi de taşınabilir hale getirildi (`gtimeout` yedeği, hiçbiri
      # yoksa zaman sınırı olmadan; adım zaman aşımı yedek).
      #
      # MALİYET (16 çekirdek / 5 GHz'de ölçüldü, 2026-09-06): toplam 235 sn.
      # Dağılım: `scene3d_engine.test.tpr` TEK BAŞINA 41 sn (654 test),
      # arcade paketleri ~1,7 sn/paket, kalan paketler ~150 ms, sondalar
      # 7 sn, kabuk denetimleri 8 sn. macOS koşucusu daha az çekirdekli;
      # koşum çoğunlukla sırayla ilerlediği için ~2x bekleniyor.
      # Fatura sorun olursa ilk bakılacak yer scene3d paketidir — ama
      # LİSTE TUTMAYIN: "şu paketleri atla" listesi senkronda kalmaz
      # (aynı tuzak `COMPILE_ONLY_TESTS` / `run_tests.ps1` ikilisinde
      # yaşandı). Ya hepsi koşar ya adım tümden kaldırılır.
      - name: Language suites (arm64)
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          TULPAR_NO_HWSTAT: "1"
        run: |
          cp build/tulpar tulpar && chmod +x tulpar
          ./build.sh suites
        timeout-minutes: 25

      # TameEngine paketi — gerekçe build-linux'taki notta. macOS'ta betik
      # BAŞLATMA DUMANINI atlıyor: orada DISPLAY yok, pencere açma denemesi
      # başsız koşucuda asılabilir.
      - name: Package TameEngine
        if: needs.detect-docs-only.outputs.docs_only != 'true' && steps.reuse.outputs.reused != 'true'
        run: |
          cp build/tulpar tulpar && chmod +x tulpar
          bash tools/package_tameengine.sh macos-universal dist
        timeout-minutes: 15

      - name: Upload TameEngine bundle
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TameEngine-macos-universal
          path: dist/TameEngine-macos-universal.tar.gz

      - name: Upload artifact
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tulpar-macos-universal
          path: dist/tulpar-macos-universal

      - name: Upload runtime library
        if: needs.detect-docs-only.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: libtulpar_runtime-macos-universal
          path: dist/libtulpar_runtime-macos-universal.a

  
  create-release:
    needs: [detect-docs-only, build-linux, build-macos]
    runs-on: ubuntu-latest
    # Stable-only versioning: releases are created ONLY when a `v*` tag
    # is pushed (e.g. `git tag -a v2.2.0 -m "..." && git push origin
    # v2.2.0`). Main/PR pushes build and test but never mint a release.
    # This keeps version numbers meaningful — like Python or Go — and
    # avoids the hundreds of rolling v2.1.0.<N> tags that accumulated
    # under the old model.
    if: |
      github.event_name == 'push' &&
      needs.detect-docs-only.outputs.docs_only != 'true' &&
      startsWith(github.ref, 'refs/tags/v')
    # No `continue-on-error` — a release-publishing failure must turn the
    # workflow red. Silent failure here meant `tulpar update` would stop
    # seeing new versions while the build itself reported green.
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '{tulpar-*,libtulpar_runtime-*,TameEngine-*}'
          merge-multiple: true

      - name: Compute release tag
        id: ver
        shell: bash
        run: |
          # This job only runs on tag pushes (see the `if:` above), so
          # GITHUB_REF is always refs/tags/v*. Extract the tag name.
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

      # Generate a SHA-256 manifest covering every published release
      # asset. `tulpar update` and the install scripts both fetch this
      # file from `releases/download/<tag>/SHA256SUMS.txt` and verify
      # each downloaded artifact against it before installing — so a
      # transit-corrupted or maliciously-swapped binary fails the
      # verification step instead of being silently installed. Format
      # matches GNU coreutils `sha256sum -b` output (`<hex>  <name>`)
      # so a user can also verify manually with `sha256sum -c`.
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          # Hash the actual files we're about to upload, not the
          # downloaded-artifacts directory layout (which may carry stale
          # entries from previous patterns). List explicitly so a missing
          # asset shows up as a CI failure here, not as a silent gap in
          # the manifest.
          ls -la
          : > SHA256SUMS.txt
          for f in \
              tulpar-linux-x64 \
              tulpar-macos-universal \
              libtulpar_runtime-linux-x64.a \
              libtulpar_runtime-macos-universal.a \
              TameEngine-linux-x64.tar.gz \
              TameEngine-macos-universal.tar.gz; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected release artifact missing: $f" >&2
              exit 1
            fi
            sha256sum -b "$f" >> SHA256SUMS.txt
          done
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      # Detached GPG signature over SHA256SUMS.txt — a release-only ed25519
      # key whose public half is committed at `release-public.asc`. The
      # signature lets someone with the public key verify that the manifest
      # was produced by THIS workflow and hasn't been swapped post-release.
      # If GPG_PRIVATE_KEY isn't configured (e.g. on a fork), skip cleanly:
      # SHA256SUMS.txt itself still ships, and install scripts treat the
      # `.asc` as opt-in.
      - name: Sign SHA256SUMS.txt (GPG, opt-in via secret)
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "GPG_PRIVATE_KEY secret not set; skipping signature (SHA256SUMS.txt still published)"
            exit 0
          fi
          # Import key into a workflow-scoped keyring; the runner is
          # ephemeral so cleanup after the job is automatic.
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1 | tail -5
          # Detached + armored signature. `--pinentry-mode loopback` plus
          # an empty `--passphrase` lets gpg sign non-interactively when
          # the key was generated without a passphrase. If GPG_PASSPHRASE
          # is set, use it; otherwise pass an empty string.
          gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE:-}" \
              --detach-sign --armor \
              --output SHA256SUMS.txt.asc \
              SHA256SUMS.txt
          echo "--- SHA256SUMS.txt.asc ---"
          cat SHA256SUMS.txt.asc

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TulparLang ${{ steps.ver.outputs.tag }} (LLVM)
          body: |
            ## TulparLang ${{ steps.ver.outputs.tag }}
            
            **LLVM-Based AOT Compiler**
            
            ### Features
            - Native compilation via LLVM backend
            - For loops, try/catch, file I/O, modules
            - Cross-platform support
            
            ### Downloads
            - `tulpar-linux-x64` - Linux executable
            - `tulpar-macos-universal` - macOS executable

            **TameEngine — 3D scene editor** (standalone, no install; the compiler is *not* required to run it):
            - `TameEngine-linux-x64.tar.gz`
            - `TameEngine-macos-universal.tar.gz`

            Unpack and run **from inside the folder** — the editor's texture / sound / model browsers look for their files relative to the working directory:
            ```bash
            tar -xzf TameEngine-linux-x64.tar.gz
            cd TameEngine-linux-x64
            ./TameEngine                                   # empty scene
            ./TameEngine sahneler/toplayici.scene.json     # sample scene
            ```
            The bundle ships the texture / sound / model palettes and three sample scenes. Shortcuts are listed inside the editor (`H`). Docs: <https://tulparlang.dev/games/editor>

            **Runtime libraries** (required for `tulpar build` / AOT, automatically installed by the one-line installer):
            - `libtulpar_runtime-linux-x64.a`
            - `libtulpar_runtime-macos-universal.a`

            **Integrity:**
            - `SHA256SUMS.txt` — `sha256sum -b` manifest covering every asset above. `tulpar update` verifies its downloads against this file; you can also check manually with `sha256sum -c SHA256SUMS.txt`.
            - `SHA256SUMS.txt.asc` — detached GPG signature over `SHA256SUMS.txt`, signed by the [TulparLang Release key](https://github.com/hamer1818/TulparLang/blob/main/release-public.asc) (fingerprint `CE5C 22BD EA61 58BC 8221 3A7E 4396 41B3 0E8D FDEE`). Optional verification: `gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt`. Present only when the workflow has the signing secret; absent on fork builds.

            ### One-line install (Linux / macOS)

            ```bash
            curl -fsSL https://tulparlang.dev/install.sh | bash
            ```

            ### Windows

            Native Windows support was **dropped in 3.13.0**. On Windows, run
            TulparLang inside **WSL** (Windows Subsystem for Linux) and use the
            Linux build — install WSL with `wsl --install`, then run the Linux
            one-liner above inside it. Everything works there: the compiler,
            Wings, the `tame`/`arcade`/`scene3d` game layers, and the web and
            Android build targets.
          draft: false
          prerelease: false
          files: |
            tulpar-linux-x64
            tulpar-macos-universal
            libtulpar_runtime-linux-x64.a
            libtulpar_runtime-macos-universal.a
            TameEngine-linux-x64.tar.gz
            TameEngine-macos-universal.tar.gz
            SHA256SUMS.txt*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
